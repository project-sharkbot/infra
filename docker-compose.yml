services:

# Todo : 
# - API 
# - BFF
# - Dashboard
# - DiscordBot
# All in the services subdirectory but in the future 
# fetch from image repository with version number

  test_db_connection:
   #image: TODO 
    build: 
      context: ../services/test-db-connection/ 
      dockerfile: Dockerfile
    container_name: test_db_connection_node
    environment:
      - REDIS_URL=redis://default:${REDIS_PASS}@redis:6379
      - DB_NAME=${DB_NAME}
      - DB_PASS=${DB_PASS}
      - DB_USER=${DB_USER}
      - REDIS_PASS=${REDIS_PASS}
    depends_on:
      - postgres
      - redis
  
  postgres:
    image: postgres:16-alpine
    container_name: sharkbot_db
    environment:
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Add initial schema and tables
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sharkbot_cache
    command: ["redis-server", "--requirepass", "${REDIS_PASS}", "--appendonly", "yes"]
    environment:
      - REDIS_PASS=${REDIS_PASS}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  pg_data:
  redis_data: